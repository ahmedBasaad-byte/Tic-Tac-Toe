<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <div class="player-info">
            <div class="profile" id="player1">
                <h2>player name: <span class="name">player 1</span></h2>
                <p>your marker is: <span class="marker">X</span></p>
                <p>your score is: <span class="score">0</span></p>
            </div>
            <div class="profile" id="player2">
                <h2 >player name: <span class="name">player 2</span></h2>
                <p >your marker is: <span class="marker">O</span></p>
                <p >your score is: <span class="score">0</span></p>
            </div>
        </div>
        <h1 class="current-player">player 1 turn</h1>
        <h1 class="result">Result is: </h1>
        <div class="playground">
            <div class="cells" id="cell0"> </div>
            <div class="cells" id="cell1"> </div>
            <div class="cells" id="cell2"> </div>
            <div class="cells" id="cell3"> </div>
            <div class="cells" id="cell4"> </div>
            <div class="cells" id="cell5"> </div>
            <div class="cells" id="cell6"> </div>
            <div class="cells" id="cell7"> </div>
            <div class="cells" id="cell8"> </div>
        </div>
        <div class="buttons">
            <button id="reset">restart</button>
        </div>
    </div>
    <dialog id="name-dialog">
    <form method="dialog">
        <h2>Enter Player Names</h2>

        <label for="p1-name">Player 1 (X):</label>
        <input type="text" id="p1-name" value="Player 1" placeholder="Player 1" autofocus>

        <label for="p2-name">Player 2 (O):</label>
        <input type="text" id="p2-name" value="Player 2" placeholder="Player 2">

        <button type="submit">Start Game</button>
    </form>
</dialog>
<script src="main.js"></script>
</body>
</html>
